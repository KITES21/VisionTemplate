
name: Build and Deploy VisionTemplate

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visiontemplate-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kites21/visiontemplate

jobs:
  # -----------------------------------------------
  # JOB 1: BUILD AND PUSH TO GHCR
  # -----------------------------------------------
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------
  # JOB 2: DEPLOY DIRECTLY ON EC2
  # -----------------------------------------------
  deploy:
    needs: build

    runs-on: [self-hosted, linux, x64, Vision_runner]

    steps:
      - name: Deploy application with automatic rollback
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          FORCE_ROLLBACK_TEST: "true"
        run: |
          set -Eeuo pipefail

          cd /opt/visiontemplate

          echo "Starting VisionTemplate deployment..."
          echo "New image: ${IMAGE_NAME}:${IMAGE_TAG}"

          # Read current deployment version
          OLD_APP_IMAGE=$(sed -n 's/^APP_IMAGE=//p' .env | tail -n 1)
          OLD_TAG=$(sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1)

          if [[ -z "$OLD_APP_IMAGE" || -z "$OLD_TAG" ]]; then
            echo "ERROR: Existing deployment version not found."
            exit 1
          fi

          echo "Previous image: ${OLD_APP_IMAGE}:${OLD_TAG}"

          # Verify that the previous image is available for rollback
          if ! docker image inspect "${OLD_APP_IMAGE}:${OLD_TAG}" >/dev/null 2>&1; then
            echo "ERROR: Previous image is unavailable locally."
            echo "Refusing to deploy without a rollback image."
            exit 1
          fi

          # Verify GHCR authentication for the actions account
          if ! docker pull "${IMAGE_NAME}:${IMAGE_TAG}"; then
            echo "ERROR: Unable to pull the new GHCR image."
            exit 1
          fi

          # Rollback function
          rollback() {
            echo "Deployment failed. Restoring previous version..."

            sed -i \
              -e "s|^APP_IMAGE=.*|APP_IMAGE=${OLD_APP_IMAGE}|" \
              -e "s|^IMAGE_TAG=.*|IMAGE_TAG=${OLD_TAG}|" \
              .env

            if ! docker compose up -d --no-deps app; then
              echo "CRITICAL: Could not restart previous application."
              return 1
            fi

            echo "Checking rollback health..."

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$(sed -n 's/^APP_PORT=//p' .env | tail -n 1)/api/ping" >/dev/null; then
                echo "Rollback successful."
                return 0
              fi

              sleep 5
            done

            echo "CRITICAL: Previous application did not become healthy."
            return 1
          }

          # Update deployment variables
          sed -i \
            -e "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_NAME}|" \
            -e "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" \
            .env

          # Start the new application image
          if ! docker compose up -d --no-deps app; then
            rollback
            exit 1
          fi

          if [[ "${FORCE_ROLLBACK_TEST:-false}" == "true" ]]; then
            echo "TEST: Simulating deployment failure..."
            rollback
            echo "TEST: Rollback completed. Marking test run as failed."
            exit 1
          fi

          # Wait for application health
          echo "Waiting for application health..."

          APP_PORT=$(sed -n 's/^APP_PORT=//p' .env | tail -n 1)

          if [[ ! "$APP_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid APP_PORT."
            rollback
            exit 1
          fi

          HEALTHY=0

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/ping" >/dev/null; then
              HEALTHY=1
              break
            fi

            echo "Waiting for application... (${i}/30)"
            sleep 5
          done

          if [[ "$HEALTHY" -ne 1 ]]; then
            echo "ERROR: New deployment failed health checks."
            rollback
            exit 1
          fi

          echo "Deployment successful!"
          echo "Running image: ${IMAGE_NAME}:${IMAGE_TAG}"

          # Remove dangling images only
          docker image prune -f
